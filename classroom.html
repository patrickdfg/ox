<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>우리 클래스 · 퀴즈 플레이</title><link rel="stylesheet" href="style.css?v=stage3"><meta name="theme-color" content="#251452"><link rel="manifest" href="manifest.json"><link rel="icon" href="assets/favicon.svg"></head>
<body class="home"><header class="topbar"><a class="brand" href="index.html">✦ QUIZ PLAY</a><div class="account-actions"><button id="account" class="account-btn">교사 Google 로그인</button><a class="top-link" href="reports.html">학습 결과</a></div></header>
<main class="library"><span class="eyebrow">CLASSROOM ORBIT</span><h1>함께 배우는 우리 클래스</h1><p>학생은 클래스 코드와 닉네임만으로 참가해요. 같은 브라우저의 학습 기록을 교사가 이어서 집계합니다.</p><p id="class-status" role="status"></p>
<div class="class-forms"><form id="join-class" class="glass-panel"><h2>클래스 참가</h2><label>클래스 코드<input id="class-code" required maxlength="8" autocomplete="off"></label><label>닉네임<input id="class-name" required maxlength="12" autocomplete="off"></label><button class="btn primary">참가하기</button></form>
<form id="create-class" class="glass-panel"><h2>교사용 클래스 만들기</h2><label>클래스 이름<input id="class-title" required maxlength="60"></label><button id="create-button" class="btn primary" disabled>클래스 만들기</button><p>Google 로그인 후 만들 수 있어요.</p></form></div>
<h2>내 클래스</h2><div id="class-list" class="report-list"></div>
<section id="class-detail" hidden><h2 id="detail-title"></h2><p id="detail-code"></p><div id="teacher-controls" hidden><form id="assign-quiz"><label>배정할 퀴즈<select id="assignment-quiz"></select></label><button class="btn primary">자율 학습 배정</button></form><button id="refresh-class">기록 새로고침</button> <button id="delete-class">클래스와 학습 기록 삭제</button><h3>참가 학생</h3><div id="class-members"></div><h3>누적 학습 기록</h3><div id="class-history" class="table-scroll"></div></div><h3>배정된 퀴즈</h3><div id="class-assignments" class="report-list"></div></section></main>
<script src="js/ui.js" defer></script><script type="module" src="js/classroom.js"></script></body></html>
