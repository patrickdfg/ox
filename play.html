<!-- 참가자 화면: 휴대폰으로 PIN 입장 후 O/X 선택 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>OX 퀴즈 참가</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="join" class="screen">
    <h1 class="logo"><span class="o">O</span><span class="x">X</span></h1>
    <form class="form" id="join-form">
      <input id="pin-input" inputmode="numeric" maxlength="6" placeholder="게임 PIN" autocomplete="off">
      <input id="name-input" maxlength="12" placeholder="닉네임" autocomplete="off">
      <button class="btn primary" type="submit">입장</button>
      <p class="msg" id="join-msg"></p>
    </form>
  </section>

  <section id="wait" class="screen" hidden>
    <p class="huge">입장 완료!</p>
    <span class="tag" id="me"></span>
    <p class="sub">화면에 내 이름이 보이나요?<br>곧 시작합니다.</p>
  </section>

  <section id="question" class="screen" hidden>
    <span class="qnum" id="pq-num"></span>
    <p class="ptext" id="pq-text"></p>
    <div class="ptimer" id="p-timer"></div>
    <div class="ox-btns">
      <button class="ox-btn" data-a="O">O</button>
      <button class="ox-btn" data-a="X">X</button>
    </div>
  </section>

  <section id="sent" class="screen" hidden>
    <p class="huge">제출 완료</p>
    <p class="sub">다른 친구들을 기다리는 중…</p>
  </section>

  <section id="result" class="screen" hidden>
    <p class="huge" id="result-title"></p>
    <p class="big" id="result-points"></p>
    <span class="tag" id="result-answer"></span>
    <p class="sub" id="result-total" style="color:#fff"></p>
  </section>

  <section id="end" class="screen" hidden>
    <p class="sub">게임 끝! 내 최종 순위는</p>
    <p class="huge" id="end-rank"></p>
    <p class="big" id="end-score"></p>
  </section>

  <script type="module" src="js/play.js"></script>
</body>
</html>
