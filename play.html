<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>퀴즈 참가 · 퀴즈 플레이</title><link rel="stylesheet" href="style.css"></head>
<body class="game theme-cosmic">
  <header class="game-top"><a class="brand" href="index.html"><span>✦</span> QUIZ PLAY</a><span class="live-badge">● LET'S PLAY</span></header>
  <section id="join" class="screen"><span class="eyebrow">READY TO PLAY?</span><h1 class="game-heading">퀴즈에 참가해요 <span>✦</span></h1><p class="sub">화면에 보이는 PIN과 닉네임을 입력해 주세요.</p><form class="form" id="join-form"><label>게임 PIN<input id="pin-input" inputmode="numeric" maxlength="6" placeholder="6자리 PIN" autocomplete="off"></label><label>닉네임<input id="name-input" maxlength="12" placeholder="나의 멋진 이름" autocomplete="off"></label><button class="btn primary" type="submit">입장하기 →</button><p class="msg" id="join-msg" role="status"></p></form></section>
  <section id="wait" class="screen" hidden><div class="celebrate">✦</div><h1 class="game-heading">입장 완료!</h1><span class="tag" id="me"></span><p class="sub">친구들을 기다리고 있어요.<br>곧 게임이 시작됩니다!</p></section>
  <section id="question" class="screen player-question" hidden><div class="player-status"><span class="qnum" id="pq-num"></span><span class="player-rank" id="player-rank"></span><span class="timer small" id="p-timer"></span></div><div class="player-card"><img id="pq-image" class="question-image" alt="문제에 첨부된 이미지" hidden><p class="qtext" id="pq-text"></p></div><div class="answer-grid player-options" id="player-options"></div><p class="game-error" id="answer-message" role="status"></p></section>
  <section id="sent" class="screen" hidden><div class="celebrate">✦</div><h1 class="game-heading">제출 완료!</h1><p class="sub">다른 친구들을 기다리는 중이에요.</p></section>
  <section id="result" class="screen" hidden><span class="eyebrow">QUESTION RESULT</span><h1 class="game-heading" id="result-title"></h1><p class="big" id="result-points"></p><span class="tag" id="result-answer"></span><p class="sub" id="result-total"></p></section>
  <section id="end" class="screen" hidden><span class="eyebrow">GREAT JOB!</span><h1 class="game-heading">게임 끝! 🏆</h1><p class="sub">나의 최종 순위</p><p class="huge" id="end-rank"></p><p class="big" id="end-score"></p><a class="btn light" href="index.html">처음으로</a></section>
  <script type="module" src="js/play.js"></script>
</body></html>
