<!-- 진행자 화면: 큰 화면에 띄워 놓고 게임을 진행 -->
<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OX 퀴즈 진행</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="lobby" class="screen" hidden>
    <div class="join-box">
      <p class="label">휴대폰으로 접속하세요</p>
      <p class="url" id="join-url"></p>
      <p class="label">게임 PIN</p>
      <p class="pin" id="pin">······</p>
    </div>
    <p class="sub">참가자 <b id="player-count">0</b>명 · 문제 <span id="total-q"></span>개</p>
    <ul class="players" id="player-list"></ul>
    <button class="btn primary" id="start-btn" disabled>게임 시작 ▶</button>
  </section>

  <section id="question" class="screen" hidden>
    <span class="qnum" id="q-num"></span>
    <p class="qtext" id="q-text"></p>
    <div class="ox-row">
      <span class="mark mark-O">O</span>
      <div class="timer" id="timer"></div>
      <span class="mark mark-X">X</span>
    </div>
    <p class="sub" id="answer-count"></p>
    <button class="btn ghost" id="skip-btn">바로 정답 공개</button>
  </section>

  <section id="reveal" class="screen" hidden>
    <span class="qnum" id="r-num"></span>
    <p class="sub" id="r-text"></p>
    <div class="reveal-grid">
      <div class="panel">
        <h2>정답</h2>
        <div class="big-mark" id="r-answer"></div>
        <div class="bars">
          <div class="bar" id="bar-o">O · <span id="count-o">0</span>명</div>
          <div class="bar" id="bar-x">X · <span id="count-x">0</span>명</div>
        </div>
        <p class="exp" id="r-exp"></p>
      </div>
      <div class="panel">
        <h2>순위 TOP 5</h2>
        <ol class="rank" id="top5"></ol>
      </div>
    </div>
    <button class="btn primary" id="next-btn">다음 문제 ▶</button>
  </section>

  <section id="end" class="screen" hidden>
    <h1 class="logo">🏆 최종 순위</h1>
    <div class="podium">
      <div class="step s2"><div class="medal">🥈</div><div class="nm" id="p2-name"></div><div id="p2-score"></div></div>
      <div class="step s1"><div class="medal">🥇</div><div class="nm" id="p1-name"></div><div id="p1-score"></div></div>
      <div class="step s3"><div class="medal">🥉</div><div class="nm" id="p3-name"></div><div id="p3-score"></div></div>
    </div>
    <ol class="rank plain" id="rest" style="width:100%;max-width:520px"></ol>
    <button class="btn" id="again-btn">새 게임</button>
  </section>

  <script type="module" src="js/host.js"></script>
</body>
</html>
